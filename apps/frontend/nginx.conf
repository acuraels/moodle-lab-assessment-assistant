user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # JWT launch parameters and Referer must never appear in access logs.
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log safe;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api_backend {
        zone api_backend 64k;
        server backend:8000 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 21m;

        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        # Do not add SAMEORIGIN/DENY: Moodle will embed the app cross-origin.

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/(api(?:/|$)|lti/launch$|health$) {
            # No URI suffix: preserve /api, /lti/launch, query and POST body.
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Referer "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_intercept_errors off;
            proxy_redirect off;
            proxy_cache off;
            add_header Cache-Control no-store always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /index.html {
            add_header Cache-Control no-cache;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
