services:
  postgres:
    image: postgres:17-alpine
    container_name: moodle-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab_assessment
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: moodle-lab-backend
    container_name: moodle-lab-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lab_assessment
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      LTI_CONSUMER_KEY: ${LTI_CONSUMER_KEY:-moodle-key}
      LTI_CONSUMER_SECRET: ${LTI_CONSUMER_SECRET:-moodle-secret}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-20971520}
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
