[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-contract"
version = "0.1.0"
description = "Internal request and result contract for laboratory assessment"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[tool.setuptools.packages.find]
where = ["."]
